serenity {
  project.name = "QA E2E - SauceDemo (Serenity Screenplay)"
  take.screenshots = AFTER_EACH_STEP
  report.show.step.details = true
  report.show.manual.tests = false
  tag.failures = "true"
  linked.tags = "issue"
}

# WebDriver / navegador
webdriver {
  driver = chrome
  base.url = "https://www.saucedemo.com"
  # Selenium Manager (incluido en Selenium 4) descarga el chromedriver compatible.
  autodownload = true
  capabilities {
    browserName = "chrome"
    "goog:chromeOptions" {
      args = [
        "--headless=new",
        "--no-sandbox",
        "--disable-dev-shm-usage",
        "--disable-gpu",
        "--window-size=1920,1080",
        "--remote-allow-origins=*"
      ]
    }
  }
}

# Tiempos de espera (ms)
serenity.timeouts {
  implicit = 5000
}
timeouts.fluent.wait = 8000

# Entornos: cambia con -Denvironment=<nombre>
environments {
  default {
    webdriver.base.url = "https://www.saucedemo.com"
  }
  headed {
    webdriver.capabilities {
      "goog:chromeOptions" {
        args = ["--start-maximized", "--remote-allow-origins=*"]
      }
    }
    webdriver.base.url = "https://www.saucedemo.com"
  }
}
